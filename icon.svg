<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- QR code pattern (stylized) -->
  <g transform="translate(80, 80)" fill="#e94560" opacity="0.9">
    <!-- Top-left finder -->
    <rect x="0" y="0" width="100" height="100" rx="8"/>
    <rect x="15" y="15" width="70" height="70" rx="4" fill="#1a1a2e"/>
    <rect x="30" y="30" width="40" height="40" rx="4" fill="#e94560"/>

    <!-- Top-right finder -->
    <rect x="252" y="0" width="100" height="100" rx="8"/>
    <rect x="267" y="15" width="70" height="70" rx="4" fill="#1a1a2e"/>
    <rect x="282" y="30" width="40" height="40" rx="4" fill="#e94560"/>

    <!-- Bottom-left finder -->
    <rect x="0" y="252" width="100" height="100" rx="8"/>
    <rect x="15" y="267" width="70" height="70" rx="4" fill="#1a1a2e"/>
    <rect x="30" y="282" width="40" height="40" rx="4" fill="#e94560"/>

    <!-- Data dots -->
    <rect x="126" y="0" width="28" height="28" rx="4"/>
    <rect x="162" y="36" width="28" height="28" rx="4"/>
    <rect x="126" y="72" width="28" height="28" rx="4"/>
    <rect x="198" y="0" width="28" height="28" rx="4"/>
    <rect x="0" y="126" width="28" height="28" rx="4"/>
    <rect x="36" y="162" width="28" height="28" rx="4"/>
    <rect x="72" y="126" width="28" height="28" rx="4"/>
    <rect x="126" y="126" width="28" height="28" rx="4"/>
    <rect x="162" y="162" width="28" height="28" rx="4"/>
    <rect x="198" y="126" width="28" height="28" rx="4"/>
    <rect x="126" y="198" width="28" height="28" rx="4"/>
    <rect x="252" y="126" width="28" height="28" rx="4"/>
    <rect x="288" y="162" width="28" height="28" rx="4"/>
    <rect x="324" y="126" width="28" height="28" rx="4"/>
    <rect x="252" y="198" width="28" height="28" rx="4"/>
    <rect x="126" y="252" width="28" height="28" rx="4"/>
    <rect x="162" y="288" width="28" height="28" rx="4"/>
    <rect x="198" y="252" width="28" height="28" rx="4"/>
    <rect x="126" y="324" width="28" height="28" rx="4"/>
    <rect x="252" y="252" width="28" height="28" rx="4"/>
    <rect x="288" y="288" width="28" height="28" rx="4"/>
    <rect x="324" y="324" width="28" height="28" rx="4"/>
    <rect x="252" y="324" width="28" height="28" rx="4"/>
    <rect x="324" y="252" width="28" height="28" rx="4"/>
  </g>

  <!-- Play triangle overlay -->
  <g transform="translate(256, 256)" opacity="0.95">
    <polygon points="-30,-40 -30,40 40,0" fill="#fff" stroke="#1a1a2e" stroke-width="4"/>
  </g>
</svg>
